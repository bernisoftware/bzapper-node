# Publica @bzapper/client no npmjs ao dar push de uma tag vX.Y.Z no repo público
# bernisoftware/bzapper-node.
#
# SEM TOKEN: publica por Trusted Publishing (OIDC), como o NuGet e o RubyGems já fazem.
# O npm confia neste repositório + este arquivo de workflow, cadastrados em
# npmjs.com → @bzapper/client → Settings → Trusted publisher. Por que não token: a conta
# exige 2FA na publicação, então um token só publicaria com "bypass 2FA" marcado — e o npm
# remove a publicação direta por token granular em janeiro de 2027. OIDC não tem segredo
# para vazar nem validade para vencer.
#
# Requisito: npm >= 11.5.1, que é o que o Node 24 já traz embutido — por isso o job de
# publicação usa 24 (a suíte continua rodando no mínimo suportado, 18, e no 22). Instalar
# `npm@latest` à mão não serve: o npm 12 exige Node >= 22.22 e o runner do Node 20 recusa.
#
# Só publica com a suíte verde (conformidade + unitários) no Node mínimo (18) e atual (22),
# rodando contra o artefato CONSTRUÍDO (os testes importam "@bzapper/client" → dist/), e com a
# tag igual à versão do package.json.
name: publish
on:
  push:
    tags: ['v*']
  # Manual: publica a versão que está no package.json deste ref. Existe porque, quando a
  # tag já foi criada, consertar o próprio workflow exigiria apagar e recriar a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: ['18', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test

  npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance (npm)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # traz npm 11.x, que é o que fala OIDC
      - name: tag == package.json
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG não bate com package.json ($PKG)"
            exit 1
          fi
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm publish --access public --provenance
